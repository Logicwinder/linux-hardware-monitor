name: Deploy System Monitor

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Remote Deployment Script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 超时设短一点，因为只是触发一下
          args: --timeout 60s

          # 【关键】这里不再写长篇脚本，只调用服务器上的文件
          script: |
            echo "🚀 触发服务器自动部署脚本..."
            # 使用 nohup 让脚本在后台跑，GitHub 立即返回成功
            nohup bash ~/auto_deploy.sh > /dev/null 2>&1 &
            echo "✅ 部署任务已下发！请查看服务器 ~/deploy_status.log"