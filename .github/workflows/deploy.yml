name: Deploy System Monitor

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          # 下面是直接在服务器上运行的命令
          script: |
            echo "🚀 开始全自动部署..."
            
            # 1. 智能安装系统依赖 (Git, Python, Pip)
            echo "🔍 检查并安装系统环境..."
            if command -v yum &> /dev/null; then
                # CentOS/Alibaba Cloud Linux
                yum install -y git python3 python3-pip || dnf install -y git python3 python3-pip
            elif command -v apt &> /dev/null; then
                # Ubuntu/Debian
                apt update
                DEBIAN_FRONTEND=noninteractive apt install -y git python3 python3-pip
            else
                echo "❌ 未识别的操作系统，无法自动安装依赖"
                exit 1
            fi
            
            # 2. 智能处理代码仓库 (第一次克隆，后续拉取)
            cd ~
            PROJECT_DIR="linux-hardware-monitor"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            if [ ! -d "$PROJECT_DIR" ]; then
                echo "📂 首次部署：正在克隆代码仓库..."
                git clone $REPO_URL $PROJECT_DIR
            else
                echo "📂 更新部署：正在拉取最新代码..."
                cd $PROJECT_DIR
                git pull origin main
            fi
            
            # 3. 进入项目目录
            cd ~/$PROJECT_DIR
            
            # 4. 执行具体的部署脚本 (install deps, restart service)
            echo "🛠️ 执行部署脚本..."
            chmod +x deploy.sh
            bash deploy.sh