name: Deploy System Monitor

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          # 这里是核心：自动检测并初始化环境
          script: |
            echo "🚀 开始自动化部署流程..."

          # 1. 自动安装 Git 和 Python (如果没装)
            echo "🔍 检查并安装系统依赖..."
            if command -v yum &> /dev/null; then
                yum install -y git python3 python3-pip || dnf install -y git python3 python3-pip
            elif command -v apt &> /dev/null; then
                apt update && DEBIAN_FRONTEND=noninteractive apt install -y git python3 python3-pip
            fi
            
            # 2. 进入家目录
            cd ~
            
            # 3. 智能判断：如果项目文件夹不存在，则克隆；如果存在，则拉取更新
            PROJECT_DIR="linux-hardware-monitor"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            if [ ! -d "$PROJECT_DIR" ]; then
                echo "📂 项目文件夹不存在，正在克隆仓库..."
                git clone $REPO_URL $PROJECT_DIR
            else
                echo "📂 项目文件夹已存在，正在拉取最新代码..."
                cd $PROJECT_DIR
                git pull origin main
            fi
            
            # 4. 进入项目目录 (确保无论上面走了哪个分支，现在都在目录里)
            cd ~/$PROJECT_DIR
            
            # 5. 安装 Python 依赖
            echo "📦 安装 Python 依赖..."
            python3 -m pip install --user -r requirements.txt
            
            # 6. 停止旧进程
            echo "🛑 停止旧进程..."
            pkill -f "python3 monitor.py" || true
            
            # 7. 启动新进程
            echo "▶️ 启动新服务..."
            chmod +x deploy.sh
            nohup python3 monitor.py > /dev/null 2>&1 &
            
            # 8. 验证
            sleep 2
            if pgrep -f "python3 monitor.py" > /dev/null; then
                echo "✅ 部署成功！服务已运行。"
                tail -n 5 system-manager.log || echo "日志尚未生成。"
            else
                echo "❌ 部署失败！服务未启动。"
                exit 1
            fi